version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    commit-message: { prefix: build }
